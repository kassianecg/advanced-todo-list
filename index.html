<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <div class="container">
    <header>
      <h1>Minhas Tarefas</h1>
      <p class="subtitle">Quarta-feira, 6 de maio</p>
    </header>

    <div class="progress-bar-wrapper">
      <div class="progress-bar">
        <div class="progress-fill" style="width: 0%"></div>
      </div>
      <span class="progress-label">0 de 0 concluídas</span>
    </div>

    <!-- Botão de reset — aparece só quando 100% concluído -->
    <div class="actions-row">
      <button class="reset-btn" id="reset-btn" hidden>🎉 Zerar tarefas</button>
      <button class="history-btn" id="history-btn">📋 Histórico</button>
    </div>

    <form class="add-form" id="add-form">
      <input
        type="text"
        id="task-input"
        class="add-input"
        placeholder="Nova tarefa..."
        autocomplete="off"
        maxlength="60"
      />
      <!-- Custom dropdown substitui o <select> nativo -->
      <div class="custom-select" id="custom-select">
        <button type="button" class="custom-select-btn" id="custom-select-btn" aria-haspopup="listbox" aria-expanded="false">
          <span id="custom-select-label">Trabalho</span>
          <svg class="custom-select-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none">
            <path d="M1 1l4 4 4-4" stroke="#9a9ab0" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <ul class="custom-select-list" id="custom-select-list" role="listbox" hidden>
          <li class="custom-select-option" data-value="work" role="option">Trabalho</li>
          <li class="custom-select-option" data-value="personal" role="option">Pessoal</li>
          <li class="custom-select-option" data-value="study" role="option">Estudo</li>
        </ul>
        <!-- hidden input carrega o valor real para o JS ler -->
        <input type="hidden" id="category-select" value="work" />
      </div>
      <button type="submit" class="add-btn" aria-label="Adicionar tarefa">+</button>
    </form>

    <ul class="task-list" id="task-list"></ul>

    <!-- Seção de histórico — dentro do card, oculta por padrão -->
    <section class="history-section" id="history-section" hidden>
      <div class="history-section-header">
        <h2 class="history-section-title">📋 Histórico do dia</h2>
        <button class="history-close-btn" id="history-close-btn" aria-label="Fechar histórico">✕</button>
      </div>
      <ul class="history-list" id="history-list"></ul>
      <p class="history-empty" id="history-empty" hidden>Nenhuma tarefa concluída ainda hoje.</p>
    </section>
  </div>

  <script src="app.js"></script>

</body>
</html>
